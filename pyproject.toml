[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ldclust"
description = "LD-based clustering of SNPs with a haplotype-testing protocol"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Gennady Khvorykh", email = "info@inzilico.com" }]
dynamic = ["version"]
keywords = ["linkage disequilibrium", "SNP", "clustering",
            "haplotype", "bioinformatics"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py",
    "pandas",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# clustering methods with lazy imports in ldclust.library
hdbscan = ["hdbscan>=0.8"]
graph = ["networkx>=3"]
igraph = ["igraph", "leidenalg", "infomap"]
# graph-tool (SBM family) is not pip-installable: create an env with
#   conda create -n sbm -c conda-forge python=3.10 numpy scipy h5py graph-tool
# and run the CLI inside that environment
all = ["hdbscan>=0.8", "networkx>=3", "igraph", "leidenalg", "infomap"]

[project.scripts]
ldclust = "ldclust.cli:main"

[tool.setuptools]
packages = ["ldclust"]

[tool.setuptools.dynamic]
version = { attr = "ldclust.__version__" }
